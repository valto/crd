<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRD social card source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-columns: 1fr 320px; padding: 78px 84px; background: #f5f1e8; color: #1d2025; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { align-self: center; }
    .eyebrow { margin: 0 0 26px; color: #3348b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-family: Georgia, serif; font-size: 68px; line-height: 1.02; letter-spacing: -.035em; }
    p { max-width: 760px; margin: 28px 0 0; color: #505761; font-size: 25px; line-height: 1.35; }
    aside { display: grid; place-items: center; }
    .mark { width: 230px; height: 230px; object-fit: contain; }
    .rule { position: absolute; right: 0; bottom: 0; left: 0; height: 18px; background: #3348b8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Capability Documentation · CRD</div>
    <h1>Capability Requirements Document</h1>
    <p>An open framework for complete capabilities across people, software, and AI agents.</p>
  </main>
  <aside><img class="mark" src="../docs/assets/crd-mark.png" alt="" /></aside>
  <div class="rule"></div>
</body>
</html>
